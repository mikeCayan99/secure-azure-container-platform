name: Container Image CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t ghcr.io/mikecayan99/secure-azure-container-platform:${{ github.sha }} ./app

      - name: Run Docker Image 
        run: docker run -d --name secure-platform-test -p 127.0.0.1:8080:8080 ghcr.io/mikecayan99/secure-azure-container-platform:${{ github.sha }}

      - name: Check container status
        run: docker ps -a

      - name: show container logs
        run: docker logs secure-platform-test

      - name: Test application inside container
        run: docker exec secure-platform-test python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/health').read().decode())"

      - name: Test Docker Image
        run: curl --fail --retry 10 --retry-delay 5 http://127.0.0.1:8080/health